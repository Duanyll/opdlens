[project]
name = "lens-visualizer"
version = "0.1.0"
description = "Interactive per-layer LogitLens vs Jacobian-Lens vocabulary visualizer"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    "torch>=2.4",
    "transformers>=5.5",
    "huggingface_hub",
    "numpy",
    "gradio>=4.44",
    "opdlens",
]

[tool.uv.sources]
opdlens = { path = "../", editable = true }

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
